appId: com.grantha.app
productName: Grantha
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: sample-vault
    to: sample-vault
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  executableName: grantha
  synopsis: A local-first notebook app
  syncDesktopName: true
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
